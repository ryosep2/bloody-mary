; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; OTA password (gitignored; copy secrets.example.ini)
extra_configs = secrets.ini

; Overridden by secrets.ini
[ota]
password =

[env:esp32doit-devkit-v1]
; Pinned: newer platform releases move to Arduino core 3.x, which this code (and IRremote LED mirroring) doesn't support
platform = platformio/espressif32 @ 7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two 1.6 MB firmware slots, for wireless updates
board_build.partitions = partitions.csv
lib_deps =
    z3t0/IRremote@^4.4.1

[env:project_windows]
extends = env:esp32doit-devkit-v1
upload_port = COM3
monitor_port = COM3

[env:project_linux]
extends = env:esp32doit-devkit-v1
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1

; Wireless updates once the ESP32 is on Wi-Fi:
;   pio run -e project_ota -t upload
[env:project_ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
upload_port = bloodymary.local
upload_flags = --auth=${ota.password}
